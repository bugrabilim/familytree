<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Soy Ağacı</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#1f6b47; color:#f7f6f2;
      font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; text-align:center; padding:24px; }
    .mark { width:96px; height:96px; margin:0 auto 20px; }
    h1 { font-size:22px; margin:0 0 8px; font-weight:700; }
    p { opacity:.85; margin:0 0 20px; max-width:280px; line-height:1.5; }
    button { appearance:none; border:0; background:#f7f6f2; color:#1f6b47; font-weight:700; font-size:15px;
      padding:12px 22px; border-radius:12px; }
  </style>
</head>
<body>
  <div>
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#f7f6f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22V11M12 11L7.5 7.5M12 11l4.5-3.5"/><circle cx="12" cy="4.5" r="2.6"/><circle cx="5.5" cy="9" r="2.4"/><circle cx="18.5" cy="9" r="2.4"/>
    </svg>
    <h1>Soy Ağacı</h1>
    <p>Bağlantı kurulamadı. İnternetini kontrol edip yeniden dene.</p>
    <button onclick="location.reload()">Yeniden dene</button>
  </div>
</body>
</html>
